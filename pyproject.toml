[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentledger-treasury"
version = "0.1.0"
description = "A financial clearinghouse and dynamic credit-allocation middleware for stateful, hierarchical multi-agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentLedger Contributors" }]
keywords = ["llm", "agents", "langgraph", "crewai", "finops", "cost-management", "token-budget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0", "langgraph>=0.1.0"]
crewai = ["crewai>=0.30.0"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/SanjayDey786/agentledger_treasury"
Repository = "https://github.com/SanjayDey786/agentledger_treasury"
Changelog = "https://github.com/SanjayDey786/agentledger_treasury/blob/main/CHANGELOG.md"
Issues = "https://github.com/SanjayDey786/agentledger_treasury/issues"

[tool.setuptools.packages.find]
include = ["agentledger_treasury*"]

[tool.ruff.lint]
# Explicit rule selection so CI behavior doesn't silently drift as ruff's
# own default rule set changes across versions (E4/E7/E9 + F is ruff's
# long-standing conservative default; newer ruff versions enable a much
# broader set -- including import-sort and code-modernization rules -- if
# this section is absent, which is what actually broke CI here).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
